<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Enterprise OT System</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { themeMain: '#4f46e5' } } } }</script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root { --theme-main: #4f46e5; } 
    * { font-family:'Kanit', sans-serif; transition: background-color 0.3s; } 
    body { background-color: #f3f4f6; } 
    .bg-main { background-color: var(--theme-main); }
    .text-main { color: var(--theme-main); }
    
    .card { background: #fff; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e5e7eb; padding: 1.25rem; margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.875rem; font-weight: 600; color: #4b5563; margin-bottom: 0.25rem; }
    .form-control { width: 100%; padding: 0.6rem 1rem; border: 1px solid #d1d5db; border-radius: 0.5rem; outline: none; font-size: 0.875rem; background: #f9fafb; }
    .form-control:focus { border-color: var(--theme-main); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; width: 100%; }
    .btn-primary { background: var(--theme-main); color: #fff; } 
    .btn-success { background: #10b981; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-outline { background: #fff; border: 1px solid #d1d5db; color: #374151; }
    .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1rem); }
    
    html.dark body { background-color: #0f172a; color: #f8fafc; }
    html.dark .card { background-color: #1e293b; border-color: #334155; }
    html.dark .form-control { background-color: #0f172a; border-color: #334155; color: #f8fafc; }
    html.dark .form-label { color: #cbd5e1; }
    html.dark header, html.dark nav { background-color: #1e293b; border-color: #334155; }
    html.dark .btn-outline { background: #1e293b; border-color: #475569; color: #f8fafc; }
  </style>
</head>
<body>

<!-- หน้าต่างเข้าสู่ระบบ -->
<div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-[100]">
  <div class="card w-full max-w-md text-center p-8">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-indigo-100 text-main mb-4">
      <i class="fa-solid fa-briefcase text-4xl"></i>
    </div>
    <h1 class="text-2xl font-black text-slate-800 tracking-tight dark:text-white">HR OT System</h1>
    
    <div class="space-y-4 text-left mt-6">
      <div>
        <label class="form-label">ชื่อผู้ใช้งาน</label>
        <input id="loginUser" type="text" class="form-control py-3" placeholder="Username" />
      </div>
      <div>
        <label class="form-label">รหัสผ่าน</label>
        <input id="loginPass" type="password" class="form-control py-3" placeholder="Password" />
      </div>
      
      <!-- 💡 Checkbox จดจำการเข้าระบบ -->
      <div class="flex items-center mt-2">
        <input type="checkbox" id="rememberMe" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 cursor-pointer" checked>
        <label for="rememberMe" class="ml-2 block text-sm text-slate-600 dark:text-slate-300 cursor-pointer">จดจำการเข้าสู่ระบบ</label>
      </div>

      <button onclick="doLogin()" class="btn btn-primary py-3 mt-2">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<!-- โครงสร้างหลักของแอป -->
<div id="app" class="hidden h-[100dvh] w-full flex flex-col relative pb-16">
  <header class="bg-white border-b px-5 py-4 flex items-center justify-between sticky top-0 z-20">
    <h1 id="pageTitle" class="text-lg font-bold text-slate-800 tracking-wide">หน้าแรก</h1>
  </header>
  
  <main id="content" class="flex-1 overflow-y-auto p-4 w-full max-w-2xl mx-auto pb-28"></main>

  <nav class="fixed bottom-0 left-0 w-full bg-white border-t flex justify-around items-center z-50 pb-safe pt-2 px-2">
    <button onclick="navigate('dashboard')" class="nav-btn text-main w-1/4" data-page="dashboard">
      <i class="fa-solid fa-chart-pie text-xl mb-1 block"></i><span class="text-[10px]">ภาพรวม</span>
    </button>
    <div class="w-1/4 flex justify-center -mt-8 relative z-10">
      <button onclick="navigate('calculate')" class="bg-main text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 border-4 border-white">
        <i class="fa-solid fa-plus text-2xl"></i>
      </button>
    </div>
    <button id="navAdmin" onclick="navigate('approval')" class="hidden nav-btn text-slate-400 w-1/4" data-page="approval">
      <i class="fa-solid fa-clipboard-check text-xl mb-1 block"></i><span class="text-[10px]">อนุมัติ</span>
    </button>
    <button onclick="navigate('profile')" class="nav-btn text-slate-400 w-1/4" data-page="profile">
      <i class="fa-solid fa-user-gear text-xl mb-1 block"></i><span class="text-[10px]">ตั้งค่า</span>
    </button>
  </nav>
</div>

<script>
// ==============================================================================
// 🚨 นำ Web App URL ของคุณมาวางตรงนี้ 🚨
const API_URL = "https://script.google.com/macros/s/AKfycbzRbVONhO8GuiHE5UL09W0aNBDCLCPh9r3A6fHCvNpv9ZM9gIJ71odt0txbEwvAoNW0_w/exec"; 
// ==============================================================================

// ลงทะเบียน PWA Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(() => console.log("Service Worker Registered"));
}

const State = { 
  user: null, 
  currentPage: 'dashboard', 
  selectedMonth: new Date().toISOString().substring(0, 7), 
  lastCalcData: null 
};

function el(id) { return document.getElementById(id); } 

// ฟังก์ชันเชื่อมต่อ Google Apps Script
function gas(fn, ...args) {
  return new Promise(async (resolve, reject) => {
    try {
      const response = await fetch(API_URL, { method: "POST", body: JSON.stringify({ fn, args }) });
      const res = await response.json();
      if (res.status === 'success') resolve(res.data); else reject(new Error(res.message));
    } catch (err) { reject(err); }
  });
}

// 💡 ระบบเข้าสู่ระบบ + ตรวจสอบ Remember Me
function doLogin() {
  const user = el('loginUser').value.trim(); 
  const pass = el('loginPass').value.trim();
  const remember = el('rememberMe').checked; // เช็คว่าติ๊กจำรหัสไหม
  
  if(!user || !pass) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');

  Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
  
  gas('login', user, pass).then(res => {
    if (res.ok) { 
      State.user = res.user; 
      
      // บันทึก Session ตามการติ๊ก
      if(remember) {
        localStorage.setItem('user', JSON.stringify(res.user)); // จำถาวร
      } else {
        sessionStorage.setItem('user', JSON.stringify(res.user)); // ลืมเมื่อปิดแอป
      }
      
      initApp(); 
      Swal.close(); 
    } 
    else { Swal.fire('ผิดพลาด', res.message, 'error'); }
  }).catch(e => { Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error'); });
}

// 💡 ออกจากระบบ: ล้างทั้ง Local และ Session
function logout() { 
  localStorage.removeItem('user'); 
  sessionStorage.removeItem('user'); 
  window.location.reload(); 
}

function initApp() { 
  el('loginScreen').classList.add('hidden'); 
  el('app').classList.remove('hidden'); 
  
  if(State.user.Role === 'admin') el('navAdmin').classList.remove('hidden');
  navigate('dashboard'); 
}

const PAGE_INFO = { dashboard:'ภาพรวมรายได้', calculate:'บันทึก OT', approval:'อนุมัติรายการ', profile:'ข้อมูลส่วนตัว' };

function navigate(page) {
  State.currentPage = page; 
  document.querySelectorAll('.nav-btn').forEach(l => { 
    if(l.dataset.page === page) { l.classList.add('text-main'); l.classList.remove('text-slate-400'); } 
    else { l.classList.remove('text-main'); l.classList.add('text-slate-400'); }
  });
  el('pageTitle').textContent = PAGE_INFO[page]; 
  el('content').innerHTML = `<div class='flex justify-center p-10'><i class="fa-solid fa-circle-notch fa-spin text-3xl text-main"></i></div>`;
  window['render_' + page]();
}

window.changeMonth = function(newMonth) { State.selectedMonth = newMonth; navigate('dashboard'); }

// ================= 📊 หน้า Dashboard =================
window.render_dashboard = async function() {
  try {
    const d = await gas('getDashboardData', State.user.UserID, State.user.Role, State.selectedMonth); 
    const s = d.summary;

    let html = `
      <div class="flex justify-between items-center mb-4 card p-2 px-4 shadow-sm border">
        <span class="text-sm font-bold text-slate-500">รอบเดือน</span>
        <input type="month" class="form-control py-1.5 px-3 w-auto text-sm bg-transparent border-none font-bold" value="${State.selectedMonth}" onchange="changeMonth(this.value)">
      </div>

      <div class="bg-gradient-to-br from-indigo-600 to-blue-500 rounded-3xl p-6 mb-4 text-white shadow-xl relative overflow-hidden">
        <p class="text-xs font-medium opacity-80 uppercase tracking-wider">เงิน OT ที่อนุมัติแล้ว</p>
        <h2 class="text-4xl font-black mt-2 mb-4">฿${Number(s.totalAmount).toLocaleString('en-US', {minimumFractionDigits: 2})}</h2>
        <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm flex justify-between">
          <div><p class="text-[10px] opacity-80">รออนุมัติ (${s.countPending})</p><p class="font-bold text-yellow-300">฿${Number(s.totalPending).toFixed(2)}</p></div>
          <div class="text-right"><p class="text-[10px] opacity-80">อนุมัติแล้ว</p><p class="font-bold">${s.countApproved} รายการ</p></div>
        </div>
      </div>

      <h3 class="font-bold text-slate-700 text-sm mb-3">ประวัติเดือนนี้</h3>
      <div class="space-y-3">
    `;

    if(d.history.length === 0) { html += `<div class="card text-center text-slate-400 py-8"><p class="text-xs">ไม่มีข้อมูลในเดือนนี้</p></div>`; } 
    else {
      d.history.forEach(o => {
        let badge = o.Status === 'อนุมัติแล้ว' ? `<span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded">อนุมัติแล้ว</span>` : (o.Status === 'ปฏิเสธ' ? `<span class="bg-red-100 text-red-700 text-[10px] font-bold px-2 py-0.5 rounded">ปฏิเสธ</span>` : `<span class="bg-yellow-100 text-yellow-700 text-[10px] font-bold px-2 py-0.5 rounded">รออนุมัติ</span>`);
        
        html += `
        <div class="card p-4 flex justify-between items-center ${o.Status==='ปฏิเสธ'?'opacity-50 line-through':''}">
          <div>
            <p class="font-bold text-slate-800 text-sm mb-1">${String(o.Date).substring(0,10)} <span class="text-[10px] text-slate-400 font-normal ml-1">(${o.TimeIn}-${o.TimeOut})</span></p>
            ${badge}
          </div>
          <div class="text-right"><p class="font-black text-indigo-600 text-lg">฿${Number(o.TotalAmount).toFixed(2)}</p></div>
        </div>`;
      });
    }
    el('content').innerHTML = html + `</div>`; 
  } catch(e) { el('content').innerHTML = `<div class="text-red-500 p-5 text-center">${e.message}</div>`; }
}

// ================= 📝 หน้าคำนวณ OT =================
window.render_calculate = function() {
  el('content').innerHTML = `
    <div class="card">
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="form-label">ประเภท</label>
          <select id="empType" class="form-control">
            <option value="monthly" ${State.user.EmpType==='monthly'?'selected':''}>รายเดือน</option>
            <option value="daily" ${State.user.EmpType==='daily'?'selected':''}>รายวัน</option>
          </select>
        </div>
        <div>
          <label class="form-label">ฐานเงิน (บาท)</label>
          <input type="number" id="baseWage" class="form-control font-bold text-main" value="${State.user.BaseWage}">
        </div>
      </div>
      <div class="space-y-3">
        <div>
          <label class="form-label">วันที่ทำ OT</label>
          <input type="date" id="workDate" class="form-control" value="${new Date().toISOString().substring(0, 10)}">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="form-label">เวลาเข้า</label><input type="time" id="timeIn" class="form-control"></div>
          <div><label class="form-label">เวลาออก</label><input type="time" id="timeOut" class="form-control"></div>
        </div>
        <div class="pt-2">
          <label class="flex items-center gap-2 bg-red-50 p-2 rounded-lg text-red-700 cursor-pointer border border-red-200">
            <input type="checkbox" id="isHoliday" class="w-5 h-5 accent-red-600 cursor-pointer">
            <span class="font-bold text-sm">วันหยุดนักขัตฤกษ์</span>
          </label>
        </div>
      </div>
    </div>
    
    <button onclick="calculateOT()" class="btn btn-primary shadow-md mb-4 py-3 text-base">
      <i class="fa-solid fa-cogs"></i> ประมวลผลและคำนวณเงิน
    </button>
    
    <div id="resultCard" class="hidden">
      <div id="slipContent" class="card border-2 border-indigo-200 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-main"></div>
        <h3 class="text-center font-black text-lg mb-1 border-b pb-2 text-slate-800">OT E-Slip</h3>
        <p class="text-center text-[10px] text-slate-500 mb-4">จัดทำโดย: ${State.user.FullName}</p>
        
        <div class="grid grid-cols-2 gap-2 text-xs mb-4 bg-slate-50 p-2 rounded-lg border">
          <div><span class="text-slate-400">วันที่:</span> <span id="resDate" class="font-bold text-slate-700"></span></div>
          <div><span class="text-slate-400">เวลา:</span> <span id="resTime" class="font-bold text-slate-700"></span></div>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-4 text-center">
          <div class="bg-slate-100 rounded-lg py-2 border"><p class="text-[9px] text-slate-500 font-bold">1.0x</p><p id="res10" class="font-bold text-sm text-slate-700">-</p></div>
          <div class="bg-indigo-50 rounded-lg py-2 border"><p class="text-[9px] text-slate-500 font-bold">1.5x</p><p id="res15" class="font-bold text-sm text-indigo-600">-</p></div>
          <div class="bg-purple-50 rounded-lg py-2 border"><p class="text-[9px] text-slate-500 font-bold">2.0x</p><p id="res20" class="font-bold text-sm text-purple-600">-</p></div>
          <div class="bg-orange-50 rounded-lg py-2 border"><p class="text-[9px] text-slate-500 font-bold">3.0x</p><p id="res30" class="font-bold text-sm text-orange-600">-</p></div>
        </div>

        <div class="bg-indigo-600 text-white rounded-xl p-3 text-center shadow-inner">
          <p class="text-[10px] opacity-80 uppercase">ยอดเงินประเมิน</p>
          <p class="text-3xl font-black mt-1">฿<span id="resTotalMoney">0.00</span></p>
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-2 mt-4">
        <button onclick="downloadSlip()" class="btn bg-white border text-slate-700 py-3"><i class="fa-solid fa-download"></i> โหลดสลิป</button>
        <button onclick="saveDataToSystem()" class="btn btn-success shadow-md py-3"><i class="fa-solid fa-paper-plane"></i> ส่งขออนุมัติ</button>
      </div>
    </div>`;
}

window.calculateOT = function() {
  const empType = el('empType').value; 
  const baseWage = parseFloat(el('baseWage').value);
  const dateVal = el('workDate').value; 
  const tIn = el('timeIn').value; 
  const tOut = el('timeOut').value;

  if(!baseWage || !dateVal || !tIn || !tOut) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกข้อมูลให้ครบถ้วนก่อนคำนวณ', 'warning');

  const dObj = new Date(dateVal); 
  const isHoliday = (dObj.getDay() === 0 || dObj.getDay() === 6) || el('isHoliday').checked;
  
  let dIn = new Date(`2000-01-01T${tIn}:00`); 
  let dOut = new Date(`2000-01-01T${tOut}:00`);
  if (dOut < dIn) dOut.setDate(dOut.getDate() + 1); // ข้ามคืน
  
  let totalHrs = (dOut - dIn) / 3600000;
  let breakDeducted = totalHrs > 5; 
  let workHrs = breakDeducted ? totalHrs - 1 : totalHrs;
  
  if(workHrs <= 0) return Swal.fire('เวลาไม่ถูกต้อง', 'เวลาทำงานน้อยเกินไป', 'error');

  let normalHrs = Math.min(workHrs, 8); 
  let otHrs = workHrs > 8 ? workHrs - 8 : 0;
  let hourlyRate = empType === 'monthly' ? (baseWage / 30 / 8) : (baseWage / 8);
  
  let hr10 = 0, hr15 = 0, hr20 = 0, hr30 = 0;

  if (isHoliday) { 
    if (empType === 'monthly') hr10 = normalHrs; else hr20 = normalHrs; 
    hr30 = otHrs; 
  } else { 
    hr15 = otHrs; 
  }
  
  let totalMoney = (hr10 * hourlyRate * 1.0) + (hr15 * hourlyRate * 1.5) + (hr20 * hourlyRate * 2.0) + (hr30 * hourlyRate * 3.0);

  // นำค่าไปใส่ในหน้าจอ
  el('resDate').textContent = dateVal; 
  el('resTime').textContent = tIn + ' - ' + tOut;
  el('res10').textContent = hr10 > 0 ? hr10.toFixed(1) + 'ช' : '-'; 
  el('res15').textContent = hr15 > 0 ? hr15.toFixed(1) + 'ช' : '-';
  el('res20').textContent = hr20 > 0 ? hr20.toFixed(1) + 'ช' : '-'; 
  el('res30').textContent = hr30 > 0 ? hr30.toFixed(1) + 'ช' : '-';
  el('resTotalMoney').textContent = totalMoney.toLocaleString('en-US', {minimumFractionDigits: 2});

  State.lastCalcData = { Date: dateVal, EmpType: empType, BaseWage: baseWage, TimeIn: tIn, TimeOut: tOut, BreakDeducted: breakDeducted ? 'ใช่' : 'ไม่', NormalHrs: normalHrs, OTHrs: otHrs, IsHoliday: isHoliday ? 'ใช่' : 'ไม่', Hr10: hr10, Hr15: hr15, Hr20: hr20, Hr30: hr30, TotalOTAmount: totalMoney };
  
  show('resultCard'); 
  el('resultCard').scrollIntoView({ behavior: 'smooth' });
}

window.downloadSlip = function() {
  html2canvas(el("slipContent")).then(canvas => { 
    let link = document.createElement('a'); 
    link.download = `OT_Slip_${State.lastCalcData.Date}.png`; 
    link.href = canvas.toDataURL(); 
    link.click(); 
  });
}

window.saveDataToSystem = async function() {
  Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
  try {
    await gas('saveOTData', State.lastCalcData, State.user);
    Swal.fire('ส่งคำขอสำเร็จ!', 'ข้อมูลถูกส่งให้แอดมินอนุมัติแล้ว', 'success').then(() => navigate('dashboard'));
  } catch (error) { 
    Swal.fire('Error', error.message, 'error'); 
  }
}

// ================= ✅ หน้า Approval (สำหรับ Admin) =================
window.render_approval = async function() {
  try {
    const d = await gas('getDashboardData', State.user.UserID, State.user.Role); 
    let html = `<h3 class="font-bold text-sm mb-3 text-slate-700">รายการรออนุมัติทั้งหมด (${d.pendingApprovals.length})</h3><div class="space-y-3">`;
    
    if(d.pendingApprovals.length === 0) { html += `<div class="card text-center text-slate-400 py-10"><i class="fa-solid fa-check-circle text-4xl mb-3 opacity-20"></i><p>ว่างเปล่า! ไม่มีรายการค้าง</p></div>`; }
    else {
      d.pendingApprovals.forEach(o => {
        html += `
        <div class="card p-4 border-l-4 border-yellow-400 shadow-md">
          <div class="flex justify-between items-start mb-2">
            <div>
              <p class="font-bold text-sm text-slate-800">${o.FullName}</p>
              <p class="text-[11px] text-slate-500 mt-0.5"><i class="fa-regular fa-calendar text-main"></i> ${String(o.Date).substring(0,10)} &nbsp;<i class="fa-regular fa-clock text-main ml-1"></i> ${o.TimeIn}-${o.TimeOut}</p>
            </div>
            <p class="font-black text-indigo-600 text-lg">฿${Number(o.TotalAmount).toFixed(2)}</p>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-slate-100">
            <button onclick="updateStatus('${o.RecordID}', 'ปฏิเสธ')" class="btn bg-red-50 text-red-600 text-xs py-2 shadow-sm">ไม่อนุมัติ</button>
            <button onclick="updateStatus('${o.RecordID}', 'อนุมัติแล้ว')" class="btn btn-success text-xs py-2 shadow-md">อนุมัติรายการ</button>
          </div>
        </div>`;
      });
    }
    el('content').innerHTML = html + `</div>`;
  } catch(e) { el('content').innerHTML = `<div class="text-red-500 text-center p-5">${e.message}</div>`; }
}

window.updateStatus = function(id, status) {
  Swal.fire({ title: `ยืนยันการ${status}?`, icon: 'warning', showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก' }).then(res => {
    if(res.isConfirmed) { 
      Swal.showLoading(); 
      gas('updateOTStatus', id, status).then(() => { 
        Swal.fire('สำเร็จ', `อัปเดตสถานะเรียบร้อย`, 'success'); 
        window.render_approval(); 
      }).catch(e => Swal.fire('Error', e.message, 'error')); 
    }
  });
}

// ================= ⚙️ หน้าโปรไฟล์ และ ออกจากระบบ =================
window.render_profile = function() {
  el('content').innerHTML = `
    <div class="card text-center mb-4">
      <div class="w-20 h-20 bg-indigo-100 text-main rounded-full mx-auto flex items-center justify-center text-4xl mb-3 border-4 border-white shadow-sm"><i class="fa-solid fa-user-tie"></i></div>
      <h3 class="font-bold text-lg text-slate-800">${State.user.FullName}</h3>
      <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mt-1 bg-slate-100 inline-block px-3 py-1 rounded-full">${State.user.Role}</p>
    </div>
    
    <div class="card space-y-4 text-left">
      <div>
        <label class="form-label">ประเภทพนักงาน</label>
        <select id="pf_type" class="form-control font-bold text-slate-700">
          <option value="monthly" ${State.user.EmpType==='monthly'?'selected':''}>พนักงานรายเดือน</option>
          <option value="daily" ${State.user.EmpType==='daily'?'selected':''}>พนักงานรายวัน</option>
        </select>
      </div>
      <div>
        <label class="form-label text-indigo-600">ฐานเงินเดือน / ค่าแรง (บาท)</label>
        <input id="pf_wage" type="number" class="form-control font-black text-indigo-600 text-lg" value="${State.user.BaseWage}">
      </div>
      <div>
        <label class="form-label mt-2">เปลี่ยนรหัสผ่าน</label>
        <input id="pf_pass" type="password" class="form-control" placeholder="เว้นว่างไว้ถ้าไม่ต้องการเปลี่ยน">
      </div>
      <button onclick="saveProfile()" class="btn btn-primary mt-2 py-3 shadow-md">อัปเดตข้อมูลส่วนตัว</button>
    </div>

    <!-- 💡 ปุ่มออกจากระบบสีแดงใหญ่ๆ -->
    <button onclick="logout()" class="btn btn-danger mt-6 py-3.5 shadow-lg shadow-red-500/30 w-full font-bold text-base">
      <i class="fa-solid fa-power-off mr-2"></i> ออกจากระบบ
    </button>
  `;
}

window.saveProfile = async function() {
  const wage = el('pf_wage').value; 
  const type = el('pf_type').value; 
  const pass = el('pf_pass').value;
  
  if(!wage) return Swal.fire('เตือน', 'กรุณาระบุฐานเงินเดือน', 'warning');
  
  Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
  
  try {
    const res = await gas('updateProfile', State.user.UserID, wage, type, pass);
    State.user.BaseWage = res.BaseWage; 
    State.user.EmpType = res.EmpType; 
    
    // อัปเดตข้อมูลใน Cache ตามที่ผู้ใช้เลือกว่าจำรหัสหรือไม่
    if(localStorage.getItem('user')) localStorage.setItem('user', JSON.stringify(State.user));
    if(sessionStorage.getItem('user')) sessionStorage.setItem('user', JSON.stringify(State.user));
    
    Swal.fire('สำเร็จ', 'อัปเดตข้อมูลส่วนตัวเรียบร้อย', 'success');
  } catch(e) { Swal.fire('Error', e.message, 'error'); }
}

// ================= ระบบตรวจสอบการล็อกอินตอนโหลดหน้าเว็บ =================
window.addEventListener('DOMContentLoaded', () => { 
  try { 
    // เช็คว่ามีข้อมูลจำไว้ใน Local หรือ Session หรือไม่
    let u = localStorage.getItem('user') || sessionStorage.getItem('user');
    if (u) { 
      State.user = JSON.parse(u); 
      initApp(); 
    } 
  } catch(e) {} 
});
</script>
</body>
</html>
